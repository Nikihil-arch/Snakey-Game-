<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake - Modern Game</title>

<style>
:root {
--primary-color: #2e7dff;
--secondary-color: #6a5cff;
--accent-color: #ff4d4d;
--success-color: #4dff88;
--bg-dark: #0a0a0a;
--bg-light: #f5f5f5;
--text-dark: #ffffff;
--text-light: #000000;
--border-color: rgba(255,255,255,0.08);
}

body.light-theme {
--bg-dark: #f5f5f5;
--bg-light: #ffffff;
--text-dark: #000000;
--text-light: #ffffff;
--border-color: rgba(0,0,0,0.08);
}

* {
box-sizing: border-box;
}

body {
margin: 0;
background: var(--bg-dark);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
min-height: 100vh;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
color: var(--text-dark);
overflow: hidden;
overscroll-behavior: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
transition: background 0.3s ease;
padding: 16px;
}

.container {
display: flex;
flex-direction: column;
align-items: center;
gap: 16px;
max-width: 800px;
width: 100%;
}

.header {
text-align: center;
width: 100%;
}

h1 {
margin: 0;
font-size: 32px;
font-weight: 700;
letter-spacing: 2px;
background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}

.stats {
display: flex;
gap: 24px;
justify-content: center;
font-size: 16px;
margin-top: 12px;
}

.stat-item {
display: flex;
flex-direction: column;
align-items: center;
gap: 4px;
}

.stat-label {
opacity: 0.7;
font-size: 12px;
text-transform: uppercase;
letter-spacing: 1px;
}

.stat-value {
font-weight: 600;
font-size: 20px;
transition: transform 0.2s ease;
}

.stat-value.pulse {
animation: scorePulse 0.4s ease;
}

@keyframes scorePulse {
0% { transform: scale(1); }
50% { transform: scale(1.2); }
100% { transform: scale(1); }
}

.controls {
display: flex;
gap: 12px;
justify-content: center;
flex-wrap: wrap;
width: 100%;
}

.control-group {
display: flex;
gap: 8px;
align-items: center;
background: rgba(255,255,255,0.05);
padding: 8px 12px;
border-radius: 10px;
border: 1px solid var(--border-color);
}

.control-group label {
font-size: 12px;
opacity: 0.8;
text-transform: uppercase;
letter-spacing: 0.5px;
}

select, input[type="range"] {
background: var(--bg-dark);
color: var(--text-dark);
border: 1px solid var(--border-color);
border-radius: 6px;
padding: 6px 10px;
font-size: 12px;
cursor: pointer;
}

input[type="range"] {
width: 100px;
padding: 2px;
}

canvas {
background: #050505;
border-radius: 20px;
box-shadow: 0 0 20px rgba(46, 125, 255, 0.4), 0 20px 60px rgba(0,0,0,0.6);
border: 2px solid rgba(46, 125, 255, 0.6);
touch-action: none;
max-width: 100%;
height: auto;
transition: box-shadow 0.3s ease, border-color 0.3s ease;
}

.button-group {
display: flex;
gap: 12px;
justify-content: center;
flex-wrap: wrap;
width: 100%;
}

button {
padding: 12px 24px;
border-radius: 12px;
border: none;
background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
color: white;
font-size: 14px;
font-weight: 600;
cursor: pointer;
transition: all 0.2s ease;
text-transform: uppercase;
letter-spacing: 0.5px;
}

button:hover {
transform: translateY(-2px);
box-shadow: 0 8px 20px rgba(46, 125, 255, 0.3);
}

button:active {
transform: scale(0.98);
}

button:disabled {
opacity: 0.5;
cursor: not-allowed;
}

#pauseBtn {
background: linear-gradient(135deg, #ffb347, #ffcc33);
color: #111;
}

#pauseBtn:hover {
box-shadow: 0 8px 20px rgba(255, 179, 71, 0.3);
}

.theme-btn, .sound-btn {
padding: 8px 12px;
font-size: 12px;
min-width: unset;
}

/* Pause overlay */
#overlay {
position: fixed;
display: none;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.8);
justify-content: center;
align-items: center;
flex-direction: column;
backdrop-filter: blur(8px);
z-index: 1000;
}

#overlay.show {
display: flex;
animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
from { opacity: 0; }
to { opacity: 1; }
}

@keyframes slideUp {
from {
transform: translateY(20px);
opacity: 0;
}
to {
transform: translateY(0);
opacity: 1;
}
}

#overlay > div {
background: var(--bg-dark);
padding: 32px;
border-radius: 20px;
border: 1px solid var(--border-color);
text-align: center;
max-width: 300px;
box-shadow: 0 20px 60px rgba(0,0,0,0.7);
animation: slideUp 0.3s ease;
}

#overlay h2 {
margin: 0 0 24px 0;
font-size: 28px;
}

#overlay button {
margin: 8px;
}

@media (max-width: 600px) {
body {
padding: 12px;
}

h1 {
font-size: 24px;
}

canvas {
border-radius: 16px;
}

.stats {
gap: 16px;
}

#overlay > div {
padding: 24px;
max-width: 90%;
}
}
</style>
</head>

<body>

<div class="container">
<div class="header">
<h1>🐍 SNAKE</h1>
<div class="stats">
<div class="stat-item">
<div class="stat-label">Score</div>
<div class="stat-value" id="score">0</div>
</div>
<div class="stat-item">
<div class="stat-label">Best</div>
<div class="stat-value" id="bestScore">0</div>
</div>
<div class="stat-item">
<div class="stat-label">Length</div>
<div class="stat-value" id="level">1</div>
</div>
</div>
</div>

<div class="controls">
<div class="control-group">
<label>Difficulty:</label>
<span id="difficultyDisplay">Progressive</span>
</div>
<button class="theme-btn" onclick="toggleTheme()" title="Toggle Dark/Light">🌙</button>
<button class="sound-btn" id="soundBtn" onclick="toggleSound()" title="Toggle Sound">🔊</button>
</div>

<canvas id="game"></canvas>

<div class="button-group">
<button onclick="startGame()">Start Game</button>
<button id="pauseBtn" onclick="togglePause()">Pause</button>
<button onclick="restart()">Restart</button>
</div>
</div>

<div id="overlay">
<div>
<h2 id="overlayTitle">Paused</h2>
<p id="overlayMessage"></p>
<button onclick="togglePause()">Resume</button>
<button onclick="restart()">Restart</button>
</div>
</div>

<script>
// Game Constants & Variables
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 20;
const baseSize = 30;
let size = baseSize;
let gridSize = 30;

let snake, prevSnake, food;
let direction, nextDirection;
let running = false;
let paused = false;
let score = 0;
let bestScore = localStorage.getItem("snakeBestScore") || 0;
let soundEnabled = localStorage.getItem("snakeSound") !== "false";
let difficulty = "normal";
let stepTime = 180;

let accumulator = 0;
let lastTime = 0;
let animationTime = 0;

// Particle system
let particles = [];
class Particle {
constructor(x, y) {
this.x = x;
this.y = y;
this.vx = (Math.random() - 0.5) * 8;
this.vy = (Math.random() - 0.5) * 8;
this.life = 1;
this.decay = Math.random() * 0.02 + 0.015;
this.size = Math.random() * 4 + 2;
this.hue = Math.random() * 30 - 15;
}

update() {
this.x += this.vx;
this.y += this.vy;
this.vy += 0.2;
this.life -= this.decay;
this.vx *= 0.95;
}

draw(ctx, cellWidth, cellHeight) {
if (this.life <= 0) return;
ctx.globalAlpha = this.life * 0.8;
ctx.fillStyle = `hsl(${45 + this.hue}, 100%, 50%)`;
ctx.beginPath();
ctx.arc(this.x * cellWidth, this.y * cellHeight, this.size, 0, Math.PI * 2);
ctx.fill();
ctx.globalAlpha = 1;
}
}

function createParticles(x, y, count = 8) {
for (let i = 0; i < count; i++) {
particles.push(new Particle(x, y));
}
}

// Dynamic difficulty - speed increases with snake length
const baseDifficulty = 180;
function calculateStepTime() {
const snakeLength = snake ? snake.length : 1;
const speedIncrease = Math.floor((snakeLength - 1) * 3);
return Math.max(50, baseDifficulty - speedIncrease);
}

// Set canvas size responsively
function setCanvasSize() {
const isDesktop = window.innerWidth > 1024;
const maxLimit = isDesktop ? 900 : 700;
const maxWidth = Math.min(window.innerWidth - 32, maxLimit);
const maxHeight = Math.min(window.innerHeight - 350, maxLimit);
const size = Math.min(maxWidth, maxHeight);
canvas.width = size;
canvas.height = size;
gridSize = baseSize;
}

setCanvasSize();
window.addEventListener("resize", setCanvasSize);

// Load best score
document.getElementById("bestScore").textContent = bestScore;

// Theme toggle
function toggleTheme() {
document.body.classList.toggle("light-theme");
localStorage.setItem("snakeTheme", document.body.classList.contains("light-theme") ? "light" : "dark");
}

// Load theme preference
if (localStorage.getItem("snakeTheme") === "light") {
document.body.classList.add("light-theme");
}

// Sound toggle
function toggleSound() {
soundEnabled = !soundEnabled;
localStorage.setItem("snakeSound", soundEnabled);
document.getElementById("soundBtn").textContent = soundEnabled ? "🔊" : "🔇";
}

// Play sound effect
function playSound(frequency = 800, duration = 100) {
if (!soundEnabled) return;
try {
const audioContext = new (window.AudioContext || window.webkitAudioContext)();
const oscillator = audioContext.createOscillator();
const gain = audioContext.createGain();
oscillator.connect(gain);
gain.connect(audioContext.destination);
oscillator.frequency.value = frequency;
gain.gain.setValueAtTime(0.3, audioContext.currentTime);
gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
oscillator.start(audioContext.currentTime);
oscillator.stop(audioContext.currentTime + duration / 1000);
} catch (e) {
// Audio context not supported
}
}

// Update difficulty display based on snake length
function updateDifficultyDisplay() {
const snakeLength = snake ? snake.length : 1;
let diffName = "Slow";
if (snakeLength > 10) diffName = "Normal";
if (snakeLength > 15) diffName = "Fast";
if (snakeLength > 20) diffName = "Very Fast";
if (snakeLength > 25) diffName = "Insane";
document.getElementById("difficultyDisplay").textContent = diffName;
}

function reset() {
snake = [{x: Math.floor(gridSize / 2), y: Math.floor(gridSize / 2)}];
prevSnake = [{x: Math.floor(gridSize / 2), y: Math.floor(gridSize / 2)}];
direction = "right";
nextDirection = "right";
score = 0;
updateScore();
placeFood();
}

function updateScore() {
document.getElementById("score").textContent = score;
document.getElementById("level").textContent = snake.length;
const scoreEl = document.getElementById("score");
scoreEl.classList.add("pulse");
setTimeout(() => scoreEl.classList.remove("pulse"), 400);
if (score > bestScore) {
bestScore = score;
localStorage.setItem("snakeBestScore", bestScore);
document.getElementById("bestScore").textContent = bestScore;
}
}

function placeFood() {
food = {
x: Math.floor(Math.random() * gridSize),
y: Math.floor(Math.random() * gridSize)
};
}

function startGame() {
if (running) return;
reset();
running = true;
paused = false;
document.getElementById("overlay").classList.remove("show");
document.getElementById("pauseBtn").disabled = false;
lastTime = performance.now();
requestAnimationFrame(loop);
}

function restart() {
running = false;
paused = false;
document.getElementById("overlay").classList.remove("show");
startGame();
}

function togglePause() {
if (!running) return;

paused = !paused;
const overlay = document.getElementById("overlay");
overlay.classList.toggle("show");

if (paused) {
document.getElementById("overlayTitle").textContent = "Paused";
document.getElementById("overlayMessage").textContent = "";
} else {
lastTime = performance.now();
requestAnimationFrame(loop);
}
}

function loop(time) {
if (!running || paused) return;

let delta = time - lastTime;
lastTime = time;
accumulator += delta;

while (accumulator >= stepTime) {
update();
accumulator -= stepTime;
}

let alpha = accumulator / stepTime;
draw(alpha);

requestAnimationFrame(loop);
}

function update() {
prevSnake = snake.map(s => ({...s}));

// Update step time based on snake length (progressive difficulty)
stepTime = calculateStepTime();
updateDifficultyDisplay();

// Update direction if next direction is valid
direction = nextDirection;

let head = {...snake[0]};

if (direction === "right") head.x++;
if (direction === "left") head.x--;
if (direction === "up") head.y--;
if (direction === "down") head.y++;

// Check food collision
if (head.x === food.x && head.y === food.y) {
score++;
createParticles(food.x, food.y, 12);
updateScore();
playSound(1000, 100);

// Haptic feedback
if (navigator.vibrate) {
navigator.vibrate(50);
}

placeFood();
} else {
snake.pop();
}

// Collision detection
if (
head.x < 0 || head.y < 0 ||
head.x >= gridSize || head.y >= gridSize ||
collision(head)
) {
running = false;
paused = false;
showGameOver();
return;
}

snake.unshift(head);
}

function showGameOver() {
document.getElementById("overlayTitle").textContent = "Game Over!";
document.getElementById("overlayMessage").textContent = `Final Score: ${score}`;
document.getElementById("overlay").classList.add("show");
document.getElementById("pauseBtn").disabled = true;
playSound(400, 200);
if (navigator.vibrate) {
navigator.vibrate([100, 50, 100]);
}
}

function collision(head) {
return snake.some(seg => seg.x === head.x && seg.y === head.y);
}

function drawGrid() {
const cellWidth = canvas.width / gridSize;
const cellHeight = canvas.height / gridSize;
ctx.fillStyle = "rgba(255,255,255,0.08)";
for (let i = 0; i < gridSize; i++) {
for (let j = 0; j < gridSize; j++) {
ctx.beginPath();
ctx.arc(i * cellWidth + cellWidth / 2, j * cellHeight + cellHeight / 2, 1, 0, Math.PI * 2);
ctx.fill();
}
}
}

function drawCornerLights() {
const cellWidth = canvas.width / gridSize;
const cellHeight = canvas.height / gridSize;
const glowIntensity = Math.sin(animationTime * 0.005) * 0.3 + 0.7;
ctx.fillStyle = `rgba(46, 125, 255, ${glowIntensity * 0.4})`;
const corners = [
{x: 0, y: 0},
{x: canvas.width, y: 0},
{x: 0, y: canvas.height},
{x: canvas.width, y: canvas.height}
];
for (let corner of corners) {
ctx.beginPath();
ctx.arc(corner.x, corner.y, 15, 0, Math.PI * 2);
ctx.fill();
}
}

function draw(alpha) {
const cellWidth = canvas.width / gridSize;
const cellHeight = canvas.height / gridSize;

animationTime++;

ctx.clearRect(0, 0, canvas.width, canvas.height);

drawGrid();
drawCornerLights();

// Draw food with pulse animation
const foodPulse = Math.sin(animationTime * 0.02) * 0.4 + 0.8;
ctx.fillStyle = "#ff4d4d";
ctx.shadowColor = "#ff4d4d";
ctx.shadowBlur = 12 * foodPulse;
ctx.beginPath();
const foodX = food.x * cellWidth + 2;
const foodY = food.y * cellHeight + 2;
const foodSize = (cellWidth - 4) * foodPulse;
const foodOffset = (cellWidth - 4 - foodSize) / 2;
ctx.roundRect(foodX + foodOffset, foodY + foodOffset, foodSize, foodSize, 6);
ctx.fill();
ctx.shadowBlur = 0;

// Draw snake with smooth interpolation
for (let i = 0; i < snake.length; i++) {
let curr = snake[i];
let prev = prevSnake[i] || curr;

let x = (prev.x + (curr.x - prev.x) * alpha) * cellWidth;
let y = (prev.y + (curr.y - prev.y) * alpha) * cellHeight;

let gradient = ctx.createLinearGradient(x, y, x + cellWidth, y + cellHeight);

if (i === 0) {
// Head - brighter color with glow
gradient.addColorStop(0, "#a6ff7a");
gradient.addColorStop(1, "#4dff88");
const headGlow = Math.sin(animationTime * 0.01) * 8 + 12;
ctx.shadowColor = "#4dff88";
ctx.shadowBlur = headGlow;
} else if (i === snake.length - 1) {
// Tail - slightly darker
gradient.addColorStop(0, "#1f8f4d");
gradient.addColorStop(1, "#156834");
} else {
// Body - medium color
gradient.addColorStop(0, "#2ecc71");
gradient.addColorStop(1, "#1f8f4d");
}

ctx.fillStyle = gradient;
ctx.beginPath();
ctx.roundRect(x + 1, y + 1, cellWidth - 2, cellHeight - 2, 6);
ctx.fill();
}

// Update and draw particles
particles = particles.filter(p => p.life > 0);
for (let particle of particles) {
particle.update();
particle.draw(ctx, cellWidth, cellHeight);
}

ctx.shadowBlur = 0;
}

// Keyboard controls for desktop
document.addEventListener("keydown", (e) => {
if (!running) return;
if (e.key === "ArrowRight" && direction !== "left") nextDirection = "right";
if (e.key === "ArrowLeft" && direction !== "right") nextDirection = "left";
if (e.key === "ArrowUp" && direction !== "down") nextDirection = "up";
if (e.key === "ArrowDown" && direction !== "up") nextDirection = "down";
if (e.key === " ") {
e.preventDefault();
togglePause();
}
}, {passive: true});

// Touch controls for mobile
let startX, startY;

canvas.addEventListener("touchstart", e => {
e.preventDefault();
startX = e.touches[0].clientX;
startY = e.touches[0].clientY;
}, {passive: false});

canvas.addEventListener("touchmove", e => {
e.preventDefault();
}, {passive: false});

canvas.addEventListener("touchend", e => {
e.preventDefault();
let dx = e.changedTouches[0].clientX - startX;
let dy = e.changedTouches[0].clientY - startY;

if (Math.abs(dx) > Math.abs(dy)) {
if (dx > 30 && direction !== "left") nextDirection = "right";
else if (dx < -30 && direction !== "right") nextDirection = "left";
} else {
if (dy > 30 && direction !== "up") nextDirection = "down";
else if (dy < -30 && direction !== "down") nextDirection = "up";
}
}, {passive: false});

// Initialize
document.getElementById("soundBtn").textContent = soundEnabled ? "🔊" : "🔇";
</script>

</body>
</html>
