<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>

<style>
body {
margin: 0;
background: radial-gradient(circle at top, #121212, #000);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
font-family: Arial, sans-serif;
color: white;
  
overflow: hidden;
overscroll-behaviour: none;

-webkit-user-select: none;
-webkit-touch-callout: none;
}

h2 {
margin: 6px 0;
font-weight: 500;
letter-spacing: 1px;
}

#score {
margin-bottom: 8px;
font-size: 14px;
opacity: 0.8;
}

canvas {
background: #050505;
border-radius: 14px;
box-shadow: 0 12px 40px rgba(0,0,0,0.6);
border: 1px solid rgba(255,255,255,0.08);

touch-action:none;
}

button {
margin-top: 10px;
padding: 10px 16px;
border-radius: 10px;
border: none;
background: linear-gradient(135deg, #2e7dff, #6a5cff);
color: white;
font-size: 14px;
}

button:active {
transform: scale(0.98);
}

#pauseBtn {
margin-top: 8px;
background: linear-gradient(135deg, #ffb347, #ffcc33);
color: #111;
}

/* Pause overlay */
#overlay {
position: absolute;
display: none;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.75);
justify-content: center;
align-items: center;
flex-direction: column;
backdrop-filter: blur(6px);
}

#overlay button {
margin: 8px;
}
</style>
</head>

<body>

<h2>Snake</h2>
<div id="score">Score: 0</div>

<canvas id="game" width="320" height="320"></canvas>

<button onclick="startGame()">Start</button>
<button id="pauseBtn" onclick="togglePause()">Pause</button>

<div id="overlay">
<h2>Paused</h2>
<button onclick="togglePause()">Resume</button>
<button onclick="restart()">Restart</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const box = 16;
const size = 20;

let snake, prevSnake, food;
let direction;
let running = false;
let paused = false;

let score = 0;
let scoreDisplay = document.getElementById("score");

let stepTime = 180;
let accumulator = 0;
let lastTime = 0;

function reset() {
snake = [{x: 10, y: 10}];
prevSnake = [{x: 10, y: 10}];
direction = "right";
score = 0;
updateScore();
placeFood();
}

function updateScore() {
scoreDisplay.textContent = "Score: " + score;
}

function placeFood() {
food = {
x: Math.floor(Math.random() * size),
y: Math.floor(Math.random() * size)
};
}

function startGame() {
if (running) return;
reset();
running = true;
paused = false;
lastTime = performance.now();
requestAnimationFrame(loop);
}

function restart() {
running = false;
paused = false;
document.getElementById("overlay").style.display = "none";
startGame();
}

function togglePause() {
if (!running) return;

paused = !paused;
document.getElementById("overlay").style.display = paused ? "flex" : "none";

if (!paused) {
lastTime = performance.now();
requestAnimationFrame(loop);
}
}

function loop(time) {
if (!running || paused) return;

let delta = time - lastTime;
lastTime = time;
accumulator += delta;

while (accumulator >= stepTime) {
update();
accumulator -= stepTime;
}

let alpha = accumulator / stepTime;
draw(alpha);

requestAnimationFrame(loop);
}

function update() {
prevSnake = snake.map(s => ({...s}));

let head = {...snake[0]};

if (direction === "right") head.x++;
if (direction === "left") head.x--;
if (direction === "up") head.y--;
if (direction === "down") head.y++;

// food
if (head.x === food.x && head.y === food.y) {
score++;
updateScore();

// mobile vibration
if (navigator.vibrate) {
navigator.vibrate(40);
}

placeFood();
} else {
snake.pop();
}

if (
head.x < 0 || head.y < 0 ||
head.x >= size || head.y >= size ||
collision(head)
) {
running = false;
alert("Game Over");
return;
}

snake.unshift(head);
}

function collision(head) {
return snake.some(seg => seg.x === head.x && seg.y === head.y);
}

function drawGrid() {
ctx.strokeStyle = "rgba(255,255,255,0.04)";
for (let i = 0; i <= size; i++) {
ctx.beginPath();
ctx.moveTo(i * box, 0);
ctx.lineTo(i * box, size * box);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(0, i * box);
ctx.lineTo(size * box, i * box);
ctx.stroke();
}
}

function draw(alpha) {
ctx.clearRect(0, 0, canvas.width, canvas.height);

drawGrid();

// food glow
ctx.fillStyle = "#ff4d4d";
ctx.shadowColor = "#ff4d4d";
ctx.shadowBlur = 12;
ctx.beginPath();
ctx.roundRect(food.x * box + 2, food.y * box + 2, box - 4, box - 4, 6);
ctx.fill();
ctx.shadowBlur = 0;

// snake
for (let i = 0; i < snake.length; i++) {
let curr = snake[i];
let prev = prevSnake[i] || curr;

let x = (prev.x + (curr.x - prev.x) * alpha) * box;
let y = (prev.y + (curr.y - prev.y) * alpha) * box;

let gradient = ctx.createLinearGradient(x, y, x + box, y + box);

if (i === 0) {
gradient.addColorStop(0, "#a6ff7a");
gradient.addColorStop(1, "#4dff88");
} else {
gradient.addColorStop(0, "#2ecc71");
gradient.addColorStop(1, "#1f8f4d");
}

ctx.fillStyle = gradient;
ctx.beginPath();
ctx.roundRect(x + 1, y + 1, box - 2, box - 2, 6);
ctx.fill();
}
}

// swipe controls
let startX, startY;

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
startX = e.touches[0].clientX;
startY = e.touches[0].clientY;
},{passive: false});

canvas.addEventListener("touchmove", e=> {
  e.preventDefault();
}, {passive: false});

canvas.addEventListener("touchend", e => {
  e.preventDefault();
let dx = e.changedTouches[0].clientX - startX;
let dy = e.changedTouches[0].clientY - startY;

if (Math.abs(dx) > Math.abs(dy)) {
if (dx > 0 && direction !== "left") direction = "right";
else if (dx < 0 && direction !== "right") direction = "left";
} else {
if (dy > 0 && direction !== "up") direction = "down";
else if (dy < 0 && direction !== "down") direction = "up";
}
},{passive:false});
</script>

</body>
</html>
