<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Neo Snake</title>
<style>
    :root{
        --bg1:#0f172a;
        --bg2:#111827;
        --accent:#22d3ee;
        --accent2:#a855f7;
        --glass:rgba(255,255,255,0.08);
        --text:#f8fafc;
        --danger:#fb7185;
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    body{
        min-height:100vh;
        background:
            radial-gradient(circle at top left, rgba(168,85,247,0.25), transparent 30%),
            radial-gradient(circle at bottom right, rgba(34,211,238,0.2), transparent 30%),
            linear-gradient(135deg,var(--bg1),var(--bg2));
        color:var(--text);
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
        padding:20px;
    }

    .container{
        width:min(95vw,520px);
    }

    .topbar{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-bottom:18px;
        padding:16px 20px;
        border-radius:24px;
        background:var(--glass);
        backdrop-filter: blur(16px);
        border:1px solid rgba(255,255,255,0.08);
        box-shadow:0 10px 40px rgba(0,0,0,0.25);
    }

    .title{
        font-size:1.6rem;
        font-weight:700;
        letter-spacing:0.5px;
    }

    .score-wrap{
        text-align:right;
    }

    .label{
        opacity:0.7;
        font-size:0.8rem;
    }

    .score{
        font-size:1.4rem;
        font-weight:700;
    }

    .game-shell{
        position:relative;
        border-radius:28px;
        overflow:hidden;
        background:rgba(255,255,255,0.05);
        backdrop-filter: blur(18px);
        border:1px solid rgba(255,255,255,0.08);
        box-shadow:0 15px 60px rgba(0,0,0,0.35);
    }

    canvas{
        width:100%;
        display:block;
        background:
            linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(135deg,#0b1120,#111827);
        background-size:24px 24px;
    }

    .overlay{
        position:absolute;
        inset:0;
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        background:rgba(2,6,23,0.65);
        backdrop-filter: blur(12px);
        transition:0.3s ease;
    }

    .hidden{
        opacity:0;
        pointer-events:none;
    }

    .overlay h1{
        font-size:2.4rem;
        margin-bottom:12px;
    }

    .overlay p{
        opacity:0.85;
        margin-bottom:24px;
        text-align:center;
        padding:0 24px;
        line-height:1.5;
    }

    button{
        border:none;
        background:linear-gradient(135deg,var(--accent),var(--accent2));
        color:white;
        padding:14px 28px;
        border-radius:999px;
        font-size:1rem;
        font-weight:700;
        cursor:pointer;
        box-shadow:0 8px 30px rgba(34,211,238,0.35);
        transition:transform 0.15s ease;
    }

    button:active{
        transform:scale(0.96);
    }

    .controls{
        margin-top:20px;
        display:grid;
        grid-template-columns:repeat(3,1fr);
        gap:12px;
        user-select:none;
    }

    .control{
        aspect-ratio:1;
        border-radius:22px;
        border:1px solid rgba(255,255,255,0.08);
        background:rgba(255,255,255,0.06);
        backdrop-filter:blur(10px);
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:1.6rem;
        color:white;
        box-shadow:0 6px 24px rgba(0,0,0,0.18);
    }

    .control:active{
        transform:scale(0.95);
        background:rgba(255,255,255,0.12);
    }

    .blank{
        visibility:hidden;
    }

    .footer{
        text-align:center;
        margin-top:16px;
        opacity:0.55;
        font-size:0.9rem;
    }
</style>
</head>
<body>
<div class="container">

    <div class="topbar">
        <div>
            <div class="title">Neo Snake</div>
            <div class="label">Modern Arcade Edition</div>
        </div>

        <div class="score-wrap">
            <div class="label">Score</div>
            <div class="score" id="score">0</div>
        </div>
    </div>

    <div class="game-shell">
        <canvas id="gameCanvas" width="480" height="480"></canvas>

        <div class="overlay" id="overlay">
            <h1>Neo Snake</h1>
            <p>Swipe with the buttons or use arrow keys. Eat energy orbs and survive as long as possible.</p>
            <button id="startBtn">Start Game</button>
        </div>
    </div>

    <div class="controls">
        <div class="blank"></div>
        <div class="control" data-dir="up">▲</div>
        <div class="blank"></div>

        <div class="control" data-dir="left">◀</div>
        <div class="control" data-dir="down">▼</div>
        <div class="control" data-dir="right">▶</div>
    </div>

    <div class="footer">
        Optimized for iPhone and mobile browsers
    </div>

</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const gridSize = 24;
const tileCount = canvas.width / gridSize;

let snake = [{x:10,y:10}];
let velocity = {x:1,y:0};
let food = {};
let score = 0;
let gameRunning = false;
let speed = 110;

const scoreEl = document.getElementById('score');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

function randomFood(){
    food = {
        x: Math.floor(Math.random()*tileCount),
        y: Math.floor(Math.random()*tileCount)
    };
}

randomFood();

function drawRoundedRect(x,y,w,h,radius,color,glow=false){
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x+w, y, x+w, y+h, radius);
    ctx.arcTo(x+w, y+h, x, y+h, radius);
    ctx.arcTo(x, y+h, x, y, radius);
    ctx.arcTo(x, y, x+w, y, radius);
    ctx.closePath();

    if(glow){
        ctx.shadowColor = color;
        ctx.shadowBlur = 18;
    }

    ctx.fillStyle = color;
    ctx.fill();

    ctx.shadowBlur = 0;
}

function gameLoop(){
    if(!gameRunning) return;

    const head = {
        x: snake[0].x + velocity.x,
        y: snake[0].y + velocity.y
    };

    if(head.x < 0) head.x = tileCount - 1;
    if(head.x >= tileCount) head.x = 0;
    if(head.y < 0) head.y = tileCount - 1;
    if(head.y >= tileCount) head.y = 0;

    for(let segment of snake){
        if(head.x === segment.x && head.y === segment.y){
            endGame();
            return;
        }
    }

    snake.unshift(head);

    if(head.x === food.x && head.y === food.y){
        score++;
        scoreEl.textContent = score;
        randomFood();

        if(speed > 55){
            speed -= 2;
        }
    } else {
        snake.pop();
    }

    render();
    setTimeout(gameLoop, speed);
}

function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const foodPulse = 0.85 + Math.sin(Date.now() * 0.01) * 0.15;

    drawRoundedRect(
        food.x * gridSize + 4,
        food.y * gridSize + 4,
        gridSize * foodPulse - 8,
        gridSize * foodPulse - 8,
        8,
        '#fb7185',
        true
    );

    snake.forEach((segment,index)=>{
        const gradient = ctx.createLinearGradient(
            segment.x * gridSize,
            segment.y * gridSize,
            segment.x * gridSize + gridSize,
            segment.y * gridSize + gridSize
        );

        gradient.addColorStop(0,'#22d3ee');
        gradient.addColorStop(1,'#a855f7');

        drawRoundedRect(
            segment.x * gridSize + 2,
            segment.y * gridSize + 2,
            gridSize - 4,
            gridSize - 4,
            8,
            gradient,
            index === 0
        );
    });
}

function startGame(){
    snake = [{x:10,y:10}];
    velocity = {x:1,y:0};
    score = 0;
    speed = 110;
    scoreEl.textContent = score;
    randomFood();

    overlay.classList.add('hidden');
    gameRunning = true;

    render();
    gameLoop();
}

function endGame(){
    gameRunning = false;
    overlay.classList.remove('hidden');

    overlay.innerHTML = `
        <h1>Game Over</h1>
        <p>Your score was <strong>${score}</strong>. Ready for another run?</p>
        <button id="restartBtn">Play Again</button>
    `;

    document.getElementById('restartBtn').addEventListener('click',()=>{
        overlay.innerHTML = `
            <h1>Neo Snake</h1>
            <p>Swipe with the buttons or use arrow keys. Eat energy orbs and survive as long as possible.</p>
            <button id="startBtn">Start Game</button>
        `;

        document.getElementById('startBtn').addEventListener('click',startGame);
        startGame();
    });
}

document.addEventListener('keydown',(e)=>{
    switch(e.key){
        case 'ArrowUp':
            if(velocity.y !== 1){
                velocity = {x:0,y:-1};
            }
            break;
        case 'ArrowDown':
            if(velocity.y !== -1){
                velocity = {x:0,y:1};
            }
            break;
        case 'ArrowLeft':
            if(velocity.x !== 1){
                velocity = {x:-1,y:0};
            }
            break;
        case 'ArrowRight':
            if(velocity.x !== -1){
                velocity = {x:1,y:0};
            }
            break;
    }
});

document.querySelectorAll('.control').forEach(btn=>{
    btn.addEventListener('touchstart',(e)=>{
        e.preventDefault();
        handleDirection(btn.dataset.dir);
    });

    btn.addEventListener('click',()=>{
        handleDirection(btn.dataset.dir);
    });
});

function handleDirection(dir){
    switch(dir){
        case 'up':
            if(velocity.y !== 1){
                velocity = {x:0,y:-1};
            }
            break;

        case 'down':
            if(velocity.y !== -1){
                velocity = {x:0,y:1};
            }
            break;

        case 'left':
            if(velocity.x !== 1){
                velocity = {x:-1,y:0};
            }
            break;

        case 'right':
            if(velocity.x !== -1){
                velocity = {x:1,y:0};
            }
            break;
    }
}

startBtn.addEventListener('click',startGame);

render();
</script>
</body>
</html>
